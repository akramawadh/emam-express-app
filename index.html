<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EMAM EXPRESS</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2b4c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMAM EXPRESS">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0f1420;
    overflow: hidden;
  }

  /* The wrapper's whole job: hide script.google.com from the address bar
     behind our own domain, and fill the viewport with no browser chrome
     of our own getting in the way. */
  #app-frame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* iOS PWA: keep content clear of the notch / home indicator */
    height: 100dvh;
    border: none;
    display: block;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1420;
    color: #6b7280;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    z-index: 10;
    transition: opacity 0.25s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading .badge {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #2952e3;
    color: #fff;
    font-weight: 700;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  #loading .spinner {
    width: 22px;
    height: 22px;
    margin-top: 14px;
    border: 3px solid #2a3348;
    border-top-color: #2952e3;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="badge">EE</div>
  <div>Loading EMAM EXPRESS&hellip;</div>
  <div class="spinner"></div>
</div>

<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycbwhK-cQMPdSPu8v3aMT4Pg8lIIgs2Fx0zPFSecrZUpkESxshgaCwduofZPzir9zFhTO/exec"
  title="EMAM EXPRESS"
  allow="clipboard-write"
></iframe>

<script>
  document.getElementById('app-frame').addEventListener('load', function () {
    document.getElementById('loading').classList.add('hidden');
  });

  // Register the service worker for installability (Add to Home Screen).
  // It only ever caches this shell — never anything from the Apps Script
  // domain, so your live data is always fetched fresh.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
